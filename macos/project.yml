name: RimeAIInputMethod
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    SWIFT_VERSION: "6.0"
targets:
  RimeAIInputMethod:
    type: application
    platform: macOS
    sources:
      - path: RimeAIInputMethod
      - path: ../Sources/RimeAIInputCore
        excludes:
          - VoiceASREvaluationArtifact.swift
      - path: ../Sources/RimeAIVoiceArtifactCore
      - path: ../Sources/RimeBridgeC/RimeBridgeC.cc
      - path: ../Sources/RimeBridgeC/include/RimeBridgeC.h
        buildPhase: headers
      - path: ../.rimeai/rime/shared
        type: folder
        buildPhase: resources
      - path: Resources/RimeAI.pdf
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ../datasets/ATTRIBUTION.md
        buildPhase: resources
      - path: ../ios/ThirdPartyLicenses
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Native/RimeAIMacRuntime.xcframework
        embed: false
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: InputMethodKit.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.wwcn.inputmethod.RimeAI
        PRODUCT_NAME: RimeAIInputMethod
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: RimeAIInputMethod/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: RimeAIInputMethod/RimeAIInputMethod-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../Sources/RimeBridgeC/include"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_DEBUG_DYLIB: false
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ONLY_ACTIVE_ARCH: true
        SKIP_INSTALL: false
      configs:
        Debug:
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-Xlinker"
            - "-export_dynamic"
        Release:
          OTHER_LDFLAGS:
            - "$(inherited)"
            - "-Wl,-exported_symbol,_rai_engine_create"
  RimeAIInputMethodTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RimeAIInputMethodTests
      - path: LaunchAgents/fun.wwcn.rimeai.voice-helper.plist
        buildPhase: resources
      - path: VoiceHelper/VoiceReleasePolicy.plist
        buildPhase: resources
    dependencies:
      - target: RimeAIInputMethod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.wwcn.inputmethod.RimeAI.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RimeAIInputMethod.app/Contents/MacOS/RimeAIInputMethod"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  RimeAIInputMethod:
    build:
      targets:
        RimeAIInputMethod: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - RimeAIInputMethodTests
