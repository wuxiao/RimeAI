    <script>
      // Apply a stored theme before first paint so the page never flashes.
      // No value (or "system") keeps the OS preference in charge.
      ;(function () {
        try {
          var theme = localStorage.getItem('rimeai-theme')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme)
          }
        } catch (error) {
          /* storage unavailable: follow the system preference */
        }
      })()
